<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 360px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      padding: 12px;
      margin: 0;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 8px;
    }
    #map-status {
      margin-bottom: 10px;
      padding: 6px 8px;
      border-radius: 4px;
      background: #f0f0f0;
    }
    #map-status.error {
      background: #fdd;
      color: #900;
    }
    #map-status.ok {
      background: #dfd;
      color: #060;
    }
    textarea {
      width: 100%;
      height: 120px;
      font-family: monospace;
      font-size: 12px;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    button {
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #results {
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
    }
    #results div {
      padding: 2px 0;
    }
    .success { color: #060; }
    .fail { color: #900; }
  </style>
</head>
<body>
  <h1>CalTopo Marker Tool</h1>
  <div id="map-status">Detecting map...</div>
  <textarea id="csv" placeholder="name,lat,lon&#10;Test Point,38.5432,-110.7654"></textarea>
  <button id="add-btn" disabled>Add Markers</button>
  <div id="results"></div>
  <script src="popup.js"></script>
</body>
</html>
